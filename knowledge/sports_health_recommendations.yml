# AGE AND GENDER STRATIFIED RECOMMENDATION PATHS
recommendation_paths:
  
  # MALE RECOMMENDATIONS BY AGE GROUP
  male:
    
    age_18_29:
      conditions:
        - parameter: "Demographic::Sex"
          value: ["Male", "M", "male", "m"]
          comparison: "in"
        - parameter: "Demographic::Age"
          value:
            interval: [18, 29]
          comparison: "in"
      
      recommendations:
        
        # VO2max - Aerobic Capacity
        - category: "Aerobic Capacity"
          priority: "High"
          title: "Enhance Aerobic Capacity - Young Adult Male"
          condition:
            parameter: "Physiological::Vo2Max"
            value:
              interval: [0, 46.0]  # Below good for age/gender
            comparison: "below"
          recommendations:
            - "Target VO2max improvement: Aim for ≥56 ml/min/kg (excellent for your age)"
            - "VT1 training: 3-4 sessions per week, 30-45 minutes at aerobic threshold"
            - "Add 1-2 high-intensity sessions: HIIT or VT2 intervals"
            - "Progressive volume increase: Add 10% per week"
            - "Monitor recovery: Check your HRV values and ensure adequate rest between sessions"
        
        # Strength and Muscle Mass — LMI trigger = below_average/poor band only
        # (not "below good"), so average muscle mass is not framed as a deficit.
        - category: "Strength and Muscle Mass"
          priority: "High"
          title: "Build Strength and Muscle Mass - Young Adult Male"
          any_of:
            - condition:
                parameter: "Physiological::Gripstrength Rechts"
                value:
                  interval: [0, 45.0]
                comparison: "below"
            - condition:
                parameter: "Body Composition::Muscle Mass Index (LMI)"
                value:
                  interval: [0, 17.66]
                comparison: "below"
          recommendations:
            - "Your muscle / strength markers leave room to build — framed as development, not a medical deficit"
            - "Strength training: 3-4 sessions per week, compound movements"
            - "Focus on progressive overload: Increase weight by 5-10% every 2-3 weeks"
            - "Protein intake: 1.8-2.2 g/kg body weight daily"
            - "Power development: Include Olympic lifts, plyometrics 2x/week"
            - "Target LMI: Aim for >20.19 kg/m² (excellent) if hypertrophy is a goal"
        
        # Body Composition — fire only in the "high" fat band (not borderline elevated),
        # so healthy / average members are not pushed into fat-loss framing.
        - category: "Body Composition"
          priority: "Medium"
          title: "Optimize Body Composition - Young Adult Male"
          any_of:
            - condition:
                parameter: "Body Composition::Fat percentage"
                value:
                  interval: [22.6, 100]
                comparison: "above"
            - condition:
                parameter: "Body Composition::Visceral Fat Index (raw value from DEXA)"
                value:
                  interval: [309.0, 9999]
                comparison: "above"
          recommendations:
            - "Your results support focused body-composition work — this is an optimisation path, not a disease diagnosis"
            - "Target body fat: Aim for 8-16% (excellent-good range) if fat loss is a personal goal"
            - "Combine resistance training with cardio for body recomposition"
            - "If fat loss is appropriate: modest caloric deficit 300-500 kcal/day"
            - "High protein diet: Preserve muscle mass during any deficit"
            - "Target visceral fat: Aim for the good range for your age group"
            - "Monitor with DEXA every 8-12 weeks"
        
        # Bone Health
        - category: "Bone Health"
          priority: "High"
          title: "Build Peak Bone Density - Young Adult Male"
          condition:
            parameter: "Body Composition::Bone mineral density"
            value:
              categorical: ["below average", "average"]
            comparison: "in"
          recommendations:
            - "Critical age for bone density: Build peak bone mass now"
            - "Resistance training: Essential for bone strength stimulation"
            - "Weight-bearing exercises: Running, jumping, strength training 3-4x/week"
            - "Impact exercises: Include plyometrics for bone health"
            - "Calcium: 1000-1200 mg daily"
            - "Vitamin D: Test levels, supplement to reach 50-100 nmol/L"
            - "Avoid excessive alcohol and smoking: Harmful to bone health"
        
        # Lower Body Power
        - category: "Lower Body Power"
          priority: "Medium"
          title: "Improve Lower Body Power - Young Adult Male"
          condition:
            parameter: "Physiological::Counter movement jump"
            value:
              interval: [0, 36.1]  # Below good range
            comparison: "below"
          recommendations:
            - "Plyometric training: 2x/week for power development"
            - "Box jumps: 3 sets of 5-8 reps, progress height gradually"
            - "Counter-movement jumps: 3 sets of 8-10 reps"
            - "Depth jumps: For advanced athletes only"
            - "Bulgarian split squats: Build unilateral leg power"
            - "Sprint training: 20-40m accelerations, 5-8 reps"
            - "Adequate recovery: 48-72 hours between power sessions"
        
        # Balance and Stability
        - category: "Balance and Stability"
          priority: "Medium"
          title: "Enhance Balance and Stability - Young Adult Male"
          condition:
            parameter: "Physiological::Y-Balance Composite Score"
            value:
              interval: [0, 91.3]  # Below optimal
            comparison: "below"
          recommendations:
            - "Single-leg balance: 30-60 seconds each leg, 3x daily"
            - "Y-Balance training: Practice reach patterns 2-3x/week"
            - "Single-leg exercises: Single-leg deadlifts, pistol squats"
            - "Proprioceptive training: BOSU ball, balance board work"
            - "Core stability: Planks, anti-rotation exercises"
            - "Ankle mobility: Essential for balance, daily ankle circles"
            - "Progress to unstable surfaces as balance improves"
        
        # Flexibility and Mobility
        # NOTE: Awaiting shoulder and hip flexibility parameters to be added to parameter dictionary
        - category: "Flexibility and Mobility"
          priority: "Medium"
          title: "Improve Flexibility - Young Adult Male"
          recommendations:
            - "Daily stretching: 10-15 minutes focusing on major muscle groups"
            - "Hip flexibility: Hip flexor stretches, pigeon pose, 90/90 stretches"
            - "Shoulder mobility: Doorway stretch, sleeper stretch, shoulder circles"
            - "Dynamic warm-up: Before training, focus on movement preparation"
            - "Static stretching: Post-training or evening, hold 30-60 seconds"
            - "Foam rolling: 5-10 minutes daily for muscle recovery"
            - "Yoga or mobility class: 1-2x/week for comprehensive flexibility"
    
